name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Pinned staticcheck
        if: matrix.go == '1.24.x'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          staticcheck ./...
      - name: Evaluate P0
        run: go run ./tools/eval -mode=ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.go }}
          path: artifacts/eval/
