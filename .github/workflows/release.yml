name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: go run ./tools/eval -mode=release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation
          path: artifacts/eval/
